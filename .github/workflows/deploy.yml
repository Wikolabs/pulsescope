name: Deploy pulsescope

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push frontend (Next.js)
        run: |
          docker build -t ghcr.io/wikolabs/pulsescope:latest .
          docker push ghcr.io/wikolabs/pulsescope:latest

      - name: Build and push backend (FastAPI)
        run: |
          docker build -t ghcr.io/wikolabs/pulsescope-backend:latest ./backend
          docker push ghcr.io/wikolabs/pulsescope-backend:latest

      - name: Deploy to VM via SSH + docker-compose
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WIKOLABS_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.WIKOLABS_VM_HOST }}
          VM_USER: ${{ secrets.WIKOLABS_VM_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Ensure target dir exists on VM
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" "mkdir -p ~/wk/pulsescope"
          # Ship the compose file
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no docker-compose.yml "$VM_USER@$VM_HOST:~/wk/pulsescope/docker-compose.yml"
          # Step A: cleanup archived containers + their networks, then ensure wkdemo-net exists
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" 'set -x; docker stop appcraft callnotes medicaliqa leadforge booklync entityresolution perfoptiq uxforge sentimentlive semantiq nexuscrm datavoice datastream graphfraud 2>/dev/null; docker rm -f appcraft callnotes medicaliqa leadforge booklync entityresolution perfoptiq uxforge sentimentlive semantiq nexuscrm datavoice datastream graphfraud 2>/dev/null; docker network ls --format "{{.Name}}" | grep -E "^(appcraft|callnotes|medicaliqa|leadforge|booklync|entityresolution|perfoptiq|uxforge|sentimentlive|semantiq|nexuscrm|datavoice|datastream|graphfraud|pulsescope|leadforge|reachwave|scoreflow|booklync|propgenai|retainiq|helpiqai|triageiq|onboardai|callnotes|datavoice|reportly|forecastiq|nexuscrm|semantiq|personaai|datastream|modelops|docextract|detectvision|bimflow|geomapai|uxforge|appcraft|perfoptiq|seowave|edgeai|iotwatch|visioncam|maintainiq|fraudguard|churnpredict|ragai|recsys|sentimentlive|agentflow|causalai|entityresolution|imagegen|medicaliqa|graphfraud|bi-wikolabs-lp|okaiz-lp|piskid-lp|wefreep|patrimai-lp-base)-net$" | xargs -r docker network rm 2>/dev/null; docker network prune -f; docker network inspect wkdemo-net >/dev/null 2>&1 || docker network create wkdemo-net; docker network ls | head -20'
          # Step B: login to GHCR on VM
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # Step C: stop any legacy single container (ignore errors)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" "docker stop pulsescope pulsescope-backend 2>/dev/null || true; docker rm pulsescope pulsescope-backend 2>/dev/null || true"
          # Step D: pull + up via docker compose
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" "cd ~/wk/pulsescope && GROQ_API_KEY='$GROQ_API_KEY' GEMINI_API_KEY='$GEMINI_API_KEY' docker compose pull"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" "cd ~/wk/pulsescope && GROQ_API_KEY='$GROQ_API_KEY' GEMINI_API_KEY='$GEMINI_API_KEY' docker compose up -d"
          echo "Deployed pulsescope stack (frontend on 3001, backend internal)"
