version: "3.9"

# PulseScope demo — production-ready POC.
# 2 services orchestrated:
#   - pulsescope (Next.js frontend on host port 3001)
#   - pulsescope-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  pulsescope-backend:
    image: ghcr.io/wikolabs/pulsescope-backend:latest
    container_name: pulsescope-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - pulsescope-net

  pulsescope:
    image: ghcr.io/wikolabs/pulsescope:latest
    container_name: pulsescope
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: "http://pulsescope-backend:8000"
    depends_on:
      - pulsescope-backend
    networks:
      - pulsescope-net

networks:
  pulsescope-net:
    name: pulsescope-net
    driver: bridge
